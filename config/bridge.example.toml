[transport]
socket_path = "/run/user/%U/chatgpt-bridge/bridge.sock"
require_peer_uid = true
require_hmac = true
hmac_secret_env = "CHATGPT_BRIDGE_HMAC_SECRET"
max_request_bytes = 524288
timestamp_tolerance_seconds = 30
nonce_replay_window_seconds = 600

[app]
cdp_url = "http://127.0.0.1:9222"
helper_path = ""
required_mode = "Work"
required_project_name = "chatgpt-bridge"
required_model_label = "GPT-5.6 Sol"
required_effort_label = "High"
renderer_origin = "http://127.0.0.1:5175"

[conversation]
reuse_by_hermes_session = true
max_turns_per_shard = 24
max_estimated_context_tokens = 70000
max_idle_days = 7
title_prefix = "HB"

[security]
allow_file_uploads = false
allow_tool_approvals = false
allow_arbitrary_cdp_eval = false
log_prompt_content = false

# Feature flags come from the environment (Phase 0: all off):
#   CHATGPT_BRIDGE_ENABLED=0
#   CHATGPT_BRIDGE_ALLOW_CREATE=0
#   CHATGPT_BRIDGE_ALLOW_SEND=0
#   CHATGPT_BRIDGE_AUTOROUTE=0
